# Archivo: netlify.toml

[build]
  # Directorio que contiene los archivos de tu web (tu index.html, etc.)
  # Si tu index.html está en la raíz, usa "."
  publish = "."

[functions]
  # Directorio donde Netlify debe buscar tus funciones para desplegarlas.
  # Basado en tu código, esta es la ruta correcta.
  directory = "netlify/functions/"

# Redirect www → apex (evita contenido duplicado en SEO)
[[redirects]]
  from   = "https://www.gringo.estate/*"
  to     = "https://gringo.estate/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/api/telemetry"
  to = "/.netlify/functions/telemetry"
  status = 200

# Gringo Office — proxy vía Netlify Function al bridge VPS (puerto 3002)
# La function office-bridge.js reenvía internamente a http://209.126.82.189:3002/api/*
[[redirects]]
  from = "/office/api/*"
  to = "/.netlify/functions/office-bridge"
  status = 200
  force = true

# Gringo Office PIXEL — mismo proxy/bridge que el office clásico
[[redirects]]
  from = "/office-pixel/api/*"
  to = "/.netlify/functions/office-bridge"
  status = 200
  force = true

# Security headers para todos los recursos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    # microphone=(self): el Dock de Hermes (office-pixel) graba notas de voz → Whisper. Solo mismo origen.
    Permissions-Policy         = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy    = "default-src 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://formspree.io https://www.google-analytics.com https://www.googletagmanager.com; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none';"

# Office Pixel: JS/CSS revalidan SIEMPRE (S45 — el browser de Franco quedaba pegado a app.js viejo).
# Combinado con el ?v= del index, cada deploy con cambios llega sin hard-refresh.
[[headers]]
  for = "/office-pixel/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/office-pixel/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# S52.2 — CAUSA RAÍZ del "no carga la versión nueva": el HTML mismo se cacheaba y seguía
# apuntando al ?v= viejo, así que el browser nunca veía el JS nuevo aunque revalidara js/*.
# Con no-cache en el HTML, el index SIEMPRE se revalida → el ?v= nuevo llega sin hard-refresh.
[[headers]]
  for = "/office-pixel/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/office-pixel/index.html"
  [headers.values]
    Cache-Control = "no-cache"
