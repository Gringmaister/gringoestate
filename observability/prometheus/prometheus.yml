global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: wispy_tokens
    metrics_path: /metrics
    static_configs:
      - targets: ["wispy_metrics_exporter:9108"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: docker
    static_configs:
      - targets: ["cadvisor:8080"]
