version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: wispy_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - wispy_observability

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: wispy_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - wispy_observability

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: wispy_node_exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    networks:
      - wispy_observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: wispy_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8089:8080"
    networks:
      - wispy_observability

  wispy_metrics_exporter:
    image: node:22-alpine
    container_name: wispy_metrics_exporter
    restart: unless-stopped
    working_dir: /app
    command: ["node", "wispy-metrics-exporter.js"]
    environment:
      PORT: 9108
      OPENCLAW_HOME: /openclaw
      WISPY_RUNTIME_URL: http://209.126.82.189:3002/wispy-runtime
    volumes:
      - ../runtime/wispy-metrics-exporter.js:/app/wispy-metrics-exporter.js:ro
      - /home/franco/.openclaw:/openclaw:ro
    ports:
      - "9108:9108"
    networks:
      - wispy_observability

volumes:
  prometheus_data:
  grafana_data:

networks:
  wispy_observability:
    name: wispy_observability
